name: Build OpenWrt packages

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: OpenWrt release version
        required: true
        default: '25.12.5'
      target:
        description: OpenWrt target
        required: true
        default: 'mediatek'
      subtarget:
        description: OpenWrt subtarget
        required: true
        default: 'filogic'

permissions:
  contents: read

concurrency:
  group: openwrt-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OPENWRT_VERSION: ${{ inputs.openwrt_version }}
      OPENWRT_TARGET: ${{ inputs.target }}
      OPENWRT_SUBTARGET: ${{ inputs.subtarget }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl zstd

      - name: Download matching OpenWrt SDK
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}"
          echo "SDK directory: $BASE"
          HTML="$(curl -fsSL "$BASE/")"
          SDK_FILE="$(printf '%s' "$HTML" | grep -oE 'openwrt-sdk-[^"<> ]+\.tar\.(zst|xz)' | head -n1)"
          if [ -z "$SDK_FILE" ]; then
            echo "Unable to locate an SDK for $OPENWRT_VERSION $OPENWRT_TARGET/$OPENWRT_SUBTARGET" >&2
            exit 1
          fi
          curl -fL "$BASE/$SDK_FILE" -o "$RUNNER_TEMP/$SDK_FILE"
          mkdir -p "$RUNNER_TEMP/openwrt-sdk"
          tar -xf "$RUNNER_TEMP/$SDK_FILE" -C "$RUNNER_TEMP/openwrt-sdk" --strip-components=1
          echo "SDK_DIR=$RUNNER_TEMP/openwrt-sdk" >> "$GITHUB_ENV"

      - name: Prepare SDK and feeds
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/prepare-sdk.sh
          scripts/prepare-sdk.sh "$SDK_DIR"

      - name: Build packages
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDK_DIR"
          make package/proxy-mode-suite/proxy-mode-core/compile V=s -j1
          make package/proxy-mode-suite/luci-app-proxy-mode/compile V=s -j1

      - name: Collect packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find "$SDK_DIR/bin" -type f \( \
            -name 'proxy-mode-core-*.apk' -o -name 'proxy-mode-core_*.apk' -o \
            -name 'proxy-mode-core-*.ipk' -o -name 'proxy-mode-core_*.ipk' -o \
            -name 'luci-app-proxy-mode-*.apk' -o -name 'luci-app-proxy-mode_*.apk' -o \
            -name 'luci-app-proxy-mode-*.ipk' -o -name 'luci-app-proxy-mode_*.ipk' \
          \) -exec cp -v {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f \( -name '*.apk' -o -name '*.ipk' \) -print -quit)"
          cd dist
          find . -maxdepth 1 -type f \( -name '*.apk' -o -name '*.ipk' \) -printf '%f\n' \
            | sort \
            | xargs sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
          ls -lah

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-mode-${{ env.OPENWRT_VERSION }}-${{ env.OPENWRT_TARGET }}-${{ env.OPENWRT_SUBTARGET }}
          path: dist/
          if-no-files-found: error
