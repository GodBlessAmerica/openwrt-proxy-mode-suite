name: Release OpenWrt packages

on:
  push:
    branches:
      - main
    paths:
      - '.github/release-trigger'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(tr -d '[:space:]' < .github/release-trigger)"
          VERSION="$(tr -d '[:space:]' < VERSION)"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "Release tag/version mismatch: trigger=$TAG VERSION=$VERSION" >&2
            exit 1
          fi

          CORE_VERSION="$(sed -n 's/^PKG_VERSION:=//p' package/proxy-mode-core/Makefile | head -n1)"
          CORE_RELEASE="$(sed -n 's/^PKG_RELEASE:=//p' package/proxy-mode-core/Makefile | head -n1)"
          LUCI_VERSION="$(sed -n 's/^PKG_VERSION:=//p' package/luci-app-proxy-mode/Makefile | head -n1)"
          LUCI_RELEASE="$(sed -n 's/^PKG_RELEASE:=//p' package/luci-app-proxy-mode/Makefile | head -n1)"

          test -n "$CORE_VERSION"
          test -n "$CORE_RELEASE"
          test -n "$LUCI_VERSION"
          test -n "$LUCI_RELEASE"

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "SUITE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CORE_PACKAGE=proxy-mode-core-${CORE_VERSION}-r${CORE_RELEASE}.apk" >> "$GITHUB_ENV"
          echo "LUCI_PACKAGE=luci-app-proxy-mode-${LUCI_VERSION}-r${LUCI_RELEASE}.apk" >> "$GITHUB_ENV"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl zstd

      - name: Download OpenWrt 25.12.5 mediatek filogic SDK
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic"
          HTML="$(curl -fsSL "$BASE/")"
          SDK_FILE="$(printf '%s' "$HTML" | grep -oE 'openwrt-sdk-[^"<> ]+\.tar\.(zst|xz)' | head -n1)"
          test -n "$SDK_FILE"
          curl -fL "$BASE/$SDK_FILE" -o "$RUNNER_TEMP/$SDK_FILE"
          mkdir -p "$RUNNER_TEMP/openwrt-sdk"
          tar -xf "$RUNNER_TEMP/$SDK_FILE" -C "$RUNNER_TEMP/openwrt-sdk" --strip-components=1
          echo "SDK_DIR=$RUNNER_TEMP/openwrt-sdk" >> "$GITHUB_ENV"

      - name: Prepare SDK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/prepare-sdk.sh
          scripts/prepare-sdk.sh "$SDK_DIR"

      - name: Build packages
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDK_DIR"
          make package/proxy-mode-suite/proxy-mode-core/compile V=s -j1
          make package/proxy-mode-suite/luci-app-proxy-mode/compile V=s -j1

      - name: Collect packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find "$SDK_DIR/bin" -type f \( \
            -name 'proxy-mode-core-*.apk' -o -name 'proxy-mode-core_*.apk' -o \
            -name 'luci-app-proxy-mode-*.apk' -o -name 'luci-app-proxy-mode_*.apk' \
          \) -exec cp -v {} dist/ \;

          test -f "dist/$CORE_PACKAGE"
          test -f "dist/$LUCI_PACKAGE"

          # Keep only the exact package revisions declared by this source tree.
          find dist -type f -name 'proxy-mode-core-*.apk' ! -name "$CORE_PACKAGE" -delete
          find dist -type f -name 'luci-app-proxy-mode-*.apk' ! -name "$LUCI_PACKAGE" -delete

          (cd dist && sha256sum "$CORE_PACKAGE" "$LUCI_PACKAGE" > SHA256SUMS)
          sha256sum -c dist/SHA256SUMS --ignore-missing
          ls -lah dist

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-mode-25.12.5-mediatek-filogic-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          NOTES=$(cat <<EOF
          OpenWrt Proxy Mode Suite ${RELEASE_TAG}

          Target: OpenWrt 25.12.5, mediatek/filogic.

          Packages:
          - ${CORE_PACKAGE}
          - ${LUCI_PACKAGE}
          - SHA256SUMS

          Highlights include safe sing-box mode management, IPv6 leak protection, upstream recovery and the LuCI dashboard.

          Documentation:
          - README.md
          - docs/INSTALL.md
          - docs/USAGE.md
          - docs/MIGRATION.md
          EOF
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "dist/$CORE_PACKAGE" "dist/$LUCI_PACKAGE" dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes "$NOTES" --prerelease "dist/$CORE_PACKAGE" "dist/$LUCI_PACKAGE" dist/SHA256SUMS
          fi
