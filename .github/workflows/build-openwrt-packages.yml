name: Build OpenWrt packages

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: OpenWrt release version
        required: true
        default: '25.12.5'
      target:
        description: OpenWrt target
        required: true
        default: 'mediatek'
      subtarget:
        description: OpenWrt subtarget
        required: true
        default: 'filogic'
      release_tag:
        description: Optional release tag, e.g. v1.0.0 (leave empty for artifact-only build)
        required: false
        default: ''
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'core/**'
      - 'luci-app-proxy-mode/**'
      - 'package/**'
      - 'scripts/**'
      - '.github/workflows/build-openwrt-packages.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OPENWRT_VERSION: ${{ github.event.inputs.openwrt_version || '25.12.5' }}
      OPENWRT_TARGET: ${{ github.event.inputs.target || 'mediatek' }}
      OPENWRT_SUBTARGET: ${{ github.event.inputs.subtarget || 'filogic' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl zstd

      - name: Download matching OpenWrt SDK
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}"
          echo "SDK directory: $BASE"
          HTML="$(curl -fsSL "$BASE/")"
          SDK_FILE="$(printf '%s' "$HTML" | grep -oE 'openwrt-sdk-[^"<> ]+\.tar\.(zst|xz)' | head -n1)"
          if [ -z "$SDK_FILE" ]; then
            echo "Unable to locate an SDK for $OPENWRT_VERSION $OPENWRT_TARGET/$OPENWRT_SUBTARGET" >&2
            exit 1
          fi
          echo "SDK_FILE=$SDK_FILE" >> "$GITHUB_ENV"
          curl -fL "$BASE/$SDK_FILE" -o "$RUNNER_TEMP/$SDK_FILE"
          mkdir -p "$RUNNER_TEMP/openwrt-sdk"
          tar -xf "$RUNNER_TEMP/$SDK_FILE" -C "$RUNNER_TEMP/openwrt-sdk" --strip-components=1
          echo "SDK_DIR=$RUNNER_TEMP/openwrt-sdk" >> "$GITHUB_ENV"

      - name: Prepare feeds
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDK_DIR"
          ./scripts/feeds update packages luci
          ./scripts/feeds install sing-box
          ./scripts/feeds install luci-base

      - name: Add Proxy Mode Suite packages
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDK_DIR"
          mkdir -p package/proxy-mode-suite
          ln -s "$GITHUB_WORKSPACE/package/proxy-mode-core" package/proxy-mode-suite/proxy-mode-core
          ln -s "$GITHUB_WORKSPACE/package/luci-app-proxy-mode" package/proxy-mode-suite/luci-app-proxy-mode
          ln -s "$GITHUB_WORKSPACE/core" package/proxy-mode-suite/core
          ln -s "$GITHUB_WORKSPACE/luci-app-proxy-mode" package/proxy-mode-suite/luci-app-proxy-mode-src
          ln -s "$GITHUB_WORKSPACE/scripts" package/proxy-mode-suite/scripts
          make defconfig

      - name: Build packages
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDK_DIR"
          make package/proxy-mode-suite/proxy-mode-core/compile V=s
          make package/proxy-mode-suite/luci-app-proxy-mode/compile V=s

      - name: Collect packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find "$SDK_DIR/bin" -type f \( -name 'proxy-mode-core_*.apk' -o -name 'proxy-mode-core_*.ipk' -o -name 'luci-app-proxy-mode_*.apk' -o -name 'luci-app-proxy-mode_*.ipk' \) -print -exec cp -v {} "$GITHUB_WORKSPACE/dist/" \;
          test -n "$(find "$GITHUB_WORKSPACE/dist" -type f -print -quit)"
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum * > SHA256SUMS)
          ls -lah "$GITHUB_WORKSPACE/dist"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-mode-${{ env.OPENWRT_VERSION }}-${{ env.OPENWRT_TARGET }}-${{ env.OPENWRT_SUBTARGET }}
          path: dist/
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ github.event.inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$MANUAL_TAG"
          if [ -z "$TAG" ]; then
            TAG="$GITHUB_REF_NAME"
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid release tag: $TAG (expected vMAJOR.MINOR.PATCH)" >&2; exit 1 ;;
          esac
          NOTES="OpenWrt Proxy Mode Suite packages for OpenWrt ${OPENWRT_VERSION} ${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}. See docs/INSTALL.md and docs/MIGRATION.md before installation or migration."
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES"
          gh release upload "$TAG" dist/* --clobber
