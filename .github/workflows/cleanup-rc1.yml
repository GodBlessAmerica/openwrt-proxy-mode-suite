name: Cleanup rc1 release assets

on:
  push:
    branches:
      - main
    paths:
      - '.github/cleanup-rc1-trigger'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Restore rc1 assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          REPO="$GITHUB_REPOSITORY"
          TAG='v1.0.0-rc1'

          gh release delete-asset "$TAG" luci-app-proxy-mode-1.0.0-r6.apk --repo "$REPO" -y || true
          gh release delete-asset "$TAG" proxy-mode-core-1.0.0-r11.apk --repo "$REPO" -y || true

          cat > /tmp/SHA256SUMS <<'EOF'
4a31162e7902d16d7ab5205634f638aaabef334d09ceb101992318812905f8e5  luci-app-proxy-mode-1.0.0-r5.apk
9a58c60bf9ba353a9e0a1aea41226d6cb7d14c3ef4acfe29120888ab48e9a301  proxy-mode-core-1.0.0-r10.apk
EOF

          gh release upload "$TAG" /tmp/SHA256SUMS --repo "$REPO" --clobber

          gh release edit "$TAG" --repo "$REPO" \
            --notes $'OpenWrt Proxy Mode Suite v1.0.0-rc1\n\nTarget: OpenWrt 25.12.5, mediatek/filogic.\n\nPackages:\n- proxy-mode-core-1.0.0-r10.apk\n- luci-app-proxy-mode-1.0.0-r5.apk\n- SHA256SUMS\n\nThis is the original rc1 prerelease. For the current release candidate, use v1.0.0-rc2.'
